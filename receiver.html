<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>RECEIVER · HP2</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap');

  :root {
    --cyan: #00f5ff;
    --green: #00ff88;
    --red: #ff3355;
    --orange: #ff8800;
    --yellow: #ffcc00;
    --bg: #050a0f;
    --surface: #0a1520;
    --border: #0d2535;
    --text: #b0d4e8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 2px,
      rgba(0,245,255,0.015) 2px, rgba(0,245,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 9999;
  }

  .panel {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--green);
    text-shadow: 0 0 12px var(--green);
  }

  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 8px var(--red);
    transition: all 0.3s;
  }
  .dot.online { background: var(--green); box-shadow: 0 0 8px var(--green); animation: blink 2s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .panel-body { padding: 20px; }

  .info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid rgba(13,37,53,0.8);
    font-size: 12px;
  }

  .info-label { opacity: 0.5; letter-spacing: 2px; font-size: 10px; }
  .info-val { color: var(--cyan); font-family: 'Orbitron', monospace; font-size: 11px; }

  .cmd-display {
    margin-top: 16px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 14px;
    text-align: center;
  }

  .cmd-label { font-size: 9px; letter-spacing: 3px; opacity: 0.4; margin-bottom: 10px; }
  .cmd-value {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    color: var(--green);
    text-shadow: 0 0 20px var(--green);
    min-height: 30px;
    transition: all 0.3s;
    word-break: break-all;
  }

  .input-group { margin-bottom: 12px; }
  .input-label { font-size: 10px; letter-spacing: 2px; opacity: 0.6; margin-bottom: 6px; display: block; }

  input[type="text"] {
    width: 100%;
    background: rgba(0,245,255,0.05);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--cyan);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
  }
  input:focus { border-color: var(--green); }

  .btn {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid var(--green);
    border-radius: 3px;
    color: var(--green);
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 4px;
  }
  .btn:active { background: rgba(0,255,136,0.1); box-shadow: 0 0 15px rgba(0,255,136,0.3); }

  .log-box {
    margin-top: 14px;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px;
    height: 100px;
    overflow-y: auto;
    font-size: 10px;
    line-height: 1.7;
  }

  .log-entry { opacity: 0.7; }
  .log-entry.ok { color: var(--green); }
  .log-entry.err { color: var(--red); }
  .log-entry.cmd { color: var(--cyan); }
  .log-entry.warn { color: var(--orange); }

  /* Camera preview overlay */
  #camOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9990;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #camOverlay.active { display: flex; }
  #camVideo {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .cam-badge {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--orange);
    background: rgba(0,0,0,0.7);
    padding: 6px 14px;
    border: 1px solid var(--orange);
    border-radius: 3px;
    z-index: 9991;
  }

  /* Screen off overlay */
  #screenOffOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    z-index: 9980;
  }
  #screenOffOverlay.active { display: block; }

  /* Background badge */
  .bg-badge {
    margin-top: 10px;
    padding: 8px 12px;
    border: 1px solid rgba(0,255,136,0.3);
    border-radius: 3px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--green);
    opacity: 0.6;
    text-align: center;
    background: rgba(0,255,136,0.04);
  }
</style>
</head>
<body>

<!-- Camera Preview Overlay -->
<div id="camOverlay">
  <div class="cam-badge" id="camBadge">📷 KAMERA AKTIF</div>
  <video id="camVideo" autoplay playsinline muted></video>
</div>

<!-- Screen Off Overlay (tap to dismiss) -->
<div id="screenOffOverlay" onclick="dismissScreenOff()"></div>

<div class="panel">
  <div class="panel-header">
    <div class="title">HP2·RECEIVER</div>
    <div class="dot" id="dot"></div>
  </div>

  <div class="panel-body">

    <div class="input-group">
      <span class="input-label">SERVER URL</span>
      <input type="text" id="serverUrl" value="ws://64.235.61.136:4101">
    </div>
    <button class="btn" id="connectBtn" onclick="toggleConnect()">CONNECT KE SERVER</button>

    <div class="bg-badge" id="bgBadge">⚙ KEEP AWAKE: NONAKTIF</div>

    <div style="margin-top:16px">
      <div class="info-row">
        <span class="info-label">STATUS</span>
        <span class="info-val" id="connStatus">OFFLINE</span>
      </div>
      <div class="info-row">
        <span class="info-label">CONTROLLER</span>
        <span class="info-val" id="ctrlStatus">BELUM CONNECT</span>
      </div>
      <div class="info-row">
        <span class="info-label">SENTER</span>
        <span class="info-val" id="torchStatus">OFF</span>
      </div>
      <div class="info-row">
        <span class="info-label">KAMERA</span>
        <span class="info-val" id="camStatus">OFF</span>
      </div>
    </div>

    <div class="cmd-display">
      <div class="cmd-label">// PERINTAH TERAKHIR</div>
      <div class="cmd-value" id="lastCmd">STANDBY</div>
    </div>

    <div class="log-box" id="logBox"></div>

  </div>
</div>

<script>
  let ws = null;
  let connected = false;

  // Torch state
  let torchStream = null;
  let torchTrack = null;
  let torchFacing = null;

  // Camera state
  let camStream = null;

  // WakeLock state
  let wakeLock = null;
  let keepAwakeInterval = null;

  // ==================
  // LOG
  // ==================
  function log(msg, type = 'info') {
    const box = document.getElementById('logBox');
    const t = new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    const el = document.createElement('div');
    el.className = 'log-entry ' + type;
    el.textContent = `[${t}] ${msg}`;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  function sendToServer(data) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify(data));
  }

  // ==================
  // WEBSOCKET
  // ==================
  function toggleConnect() {
    if (connected) { ws.close(); return; }

    const url = document.getElementById('serverUrl').value.trim();
    log('Connecting...');
    try { ws = new WebSocket(url); } catch(e) { log('URL invalid', 'err'); return; }

    ws.onopen = () => {
      connected = true;
      document.getElementById('dot').className = 'dot online';
      document.getElementById('connStatus').textContent = 'ONLINE';
      document.getElementById('connectBtn').textContent = 'DISCONNECT';
      log('Terhubung ke server', 'ok');
      ws.send(JSON.stringify({ type: 'register', role: 'receiver' }));
      // Mulai keep awake otomatis saat connect
      startKeepAwake();
    };

    ws.onmessage = (e) => {
      let msg; try { msg = JSON.parse(e.data); } catch { return; }
      if (msg.type === 'registered') {
        log('Terdaftar sebagai RECEIVER', 'ok');
        document.getElementById('ctrlStatus').textContent = 'MENUNGGU...';
      }
      if (msg.type === 'command') handleCommand(msg);
    };

    ws.onclose = () => {
      connected = false;
      document.getElementById('dot').className = 'dot';
      document.getElementById('connStatus').textContent = 'OFFLINE';
      document.getElementById('ctrlStatus').textContent = 'TERPUTUS';
      document.getElementById('connectBtn').textContent = 'CONNECT KE SERVER';
      log('Terputus', 'err');
      stopTorch();
      stopCamera();
      stopKeepAwake();
    };

    ws.onerror = () => log('Gagal connect', 'err');
  }

  // ==================
  // HANDLE COMMANDS
  // ==================
  function handleCommand(msg) {
    const action = msg.action;
    document.getElementById('lastCmd').textContent = action.toUpperCase();
    log('Perintah diterima: ' + action, 'cmd');
    document.getElementById('ctrlStatus').textContent = 'AKTIF';

    switch(action) {

      case 'torch':
        // msg.facing = 'back' | 'front', msg.state = true/false
        if (msg.state) {
          startTorch(msg.facing || 'back');
        } else {
          stopTorch();
        }
        break;

      case 'torchOff':
        stopTorch();
        break;

      case 'camera':
        // msg.facing = 'back' | 'front'
        startCamera(msg.facing || 'back');
        break;

      case 'camOff':
        stopCamera();
        break;

      case 'vibrate':
        doVibrate();
        break;

      case 'keepAwake':
        if (msg.state) {
          startKeepAwake();
        } else {
          stopKeepAwake();
        }
        break;

      case 'screenOff':
        doScreenOff();
        break;

      case 'getStatus':
        reportStatus();
        break;
    }
  }

  // ==================
  // TORCH (SENTER)
  // ==================
  async function startTorch(facing) {
    // Stop existing torch first
    await stopTorch(true);

    try {
      const facingMode = facing === 'front' ? 'user' : 'environment';
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode }
      });
      torchStream = stream;
      torchTrack = stream.getVideoTracks()[0];
      torchFacing = facing;

      const capabilities = torchTrack.getCapabilities();
      if (capabilities.torch) {
        await torchTrack.applyConstraints({ advanced: [{ torch: true }] });
        log(`Senter ${facing === 'front' ? 'DEPAN' : 'BELAKANG'} ON`, 'ok');
        sendToServer({ type: 'response', msg: `Senter ${facing === 'front' ? 'Depan' : 'Belakang'} ON` });
        document.getElementById('torchStatus').textContent = facing === 'front' ? 'DEPAN ON' : 'BLKNG ON';
      } else {
        // Torch not supported on this camera facing
        torchTrack.stop();
        torchStream.getTracks().forEach(t => t.stop());
        torchStream = null; torchTrack = null;
        log(`Torch tidak support di kamera ${facing}`, 'warn');
        sendToServer({ type: 'response', msg: `Torch tidak support kamera ${facing}` });
      }
    } catch(err) {
      log('Gagal akses kamera: ' + err.message, 'err');
      sendToServer({ type: 'response', msg: 'Gagal akses kamera: ' + err.message });
    }
  }

  async function stopTorch(silent = false) {
    if (torchTrack) {
      try { await torchTrack.applyConstraints({ advanced: [{ torch: false }] }); } catch {}
      torchTrack.stop();
      torchTrack = null;
    }
    if (torchStream) {
      torchStream.getTracks().forEach(t => t.stop());
      torchStream = null;
    }
    torchFacing = null;
    document.getElementById('torchStatus').textContent = 'OFF';
    if (!silent) {
      log('Senter OFF', 'ok');
      sendToServer({ type: 'response', msg: 'Senter OFF' });
    }
  }

  // ==================
  // KAMERA
  // ==================
  async function startCamera(facing) {
    await stopCamera(true);

    try {
      const facingMode = facing === 'front' ? 'user' : 'environment';
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
        audio: false
      });
      camStream = stream;

      const video = document.getElementById('camVideo');
      video.srcObject = stream;
      document.getElementById('camOverlay').classList.add('active');
      document.getElementById('camBadge').textContent = facing === 'front' ? '🤳 KAMERA DEPAN AKTIF' : '📷 KAMERA BELAKANG AKTIF';
      document.getElementById('camStatus').textContent = facing === 'front' ? 'DEPAN ON' : 'BLKNG ON';

      log(`Kamera ${facing === 'front' ? 'DEPAN' : 'BELAKANG'} ON`, 'ok');
      sendToServer({ type: 'response', msg: `Kamera ${facing === 'front' ? 'Depan' : 'Belakang'} ON` });
    } catch(err) {
      log('Gagal buka kamera: ' + err.message, 'err');
      sendToServer({ type: 'response', msg: 'Gagal buka kamera: ' + err.message });
    }
  }

  async function stopCamera(silent = false) {
    if (camStream) {
      camStream.getTracks().forEach(t => t.stop());
      camStream = null;
    }
    const video = document.getElementById('camVideo');
    video.srcObject = null;
    document.getElementById('camOverlay').classList.remove('active');
    document.getElementById('camStatus').textContent = 'OFF';
    if (!silent) {
      log('Kamera OFF', 'ok');
      sendToServer({ type: 'response', msg: 'Kamera OFF' });
    }
  }

  // ==================
  // VIBRATE
  // ==================
  function doVibrate() {
    if ('vibrate' in navigator) {
      navigator.vibrate([200, 100, 200, 100, 200]);
      log('Vibrasi OK', 'ok');
      sendToServer({ type: 'response', msg: 'Vibrasi OK' });
    } else {
      log('Vibrasi tidak support', 'err');
      sendToServer({ type: 'response', msg: 'Vibrasi tidak support' });
    }
  }

  // ==================
  // KEEP AWAKE / BACKGROUND
  // ==================
  async function startKeepAwake() {
    // Coba WakeLock API (modern)
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => {
          log('WakeLock dilepas sistem', 'warn');
          // Coba re-acquire jika masih harusnya aktif
          if (connected) {
            setTimeout(() => { if (connected) startKeepAwake(); }, 2000);
          }
        });
        log('Keep Awake (WakeLock) aktif', 'ok');
        sendToServer({ type: 'response', msg: 'Keep Awake ON' });
      }
    } catch(e) {
      log('WakeLock gagal: ' + e.message, 'warn');
    }

    // Fallback: NoSleep via hidden video trick
    if (!keepAwakeInterval) {
      keepAwakeInterval = setInterval(() => {
        // Kirim heartbeat ke server supaya koneksi tetap hidup
        if (connected && ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ type: 'heartbeat' }));
        }
        // Coba re-acquire wake lock kalau lepas
        if ('wakeLock' in navigator && (!wakeLock || wakeLock.released)) {
          navigator.wakeLock.request('screen').then(wl => {
            wakeLock = wl;
          }).catch(() => {});
        }
      }, 15000); // setiap 15 detik
    }

    document.getElementById('bgBadge').textContent = '⚙ KEEP AWAKE: AKTIF';
    document.getElementById('bgBadge').style.color = 'var(--green)';
    document.getElementById('bgBadge').style.borderColor = 'rgba(0,255,136,0.4)';
  }

  function stopKeepAwake() {
    if (wakeLock && !wakeLock.released) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
    if (keepAwakeInterval) {
      clearInterval(keepAwakeInterval);
      keepAwakeInterval = null;
    }
    log('Keep Awake OFF', 'ok');
    sendToServer({ type: 'response', msg: 'Keep Awake OFF' });
    document.getElementById('bgBadge').textContent = '⚙ KEEP AWAKE: NONAKTIF';
    document.getElementById('bgBadge').style.color = 'var(--green)';
    document.getElementById('bgBadge').style.borderColor = 'rgba(0,255,136,0.3)';
    document.getElementById('bgBadge').style.opacity = '0.5';
  }

  // ==================
  // SCREEN OFF
  // ==================
  function doScreenOff() {
    // Layar gelap total — tap untuk dismiss
    document.getElementById('screenOffOverlay').classList.add('active');
    log('Layar OFF (tap untuk nyalakan)', 'ok');
    sendToServer({ type: 'response', msg: 'Layar OFF' });

    // Auto dismiss setelah 60 detik kalau ga disentuh
    setTimeout(() => dismissScreenOff(), 60000);
  }

  function dismissScreenOff() {
    document.getElementById('screenOffOverlay').classList.remove('active');
    log('Layar ON (tap dismiss)', 'ok');
    sendToServer({ type: 'response', msg: 'Layar ON (manual)' });
  }

  // ==================
  // STATUS REPORT
  // ==================
  async function reportStatus() {
    const data = {
      platform: navigator.platform || navigator.userAgentData?.platform || 'Android',
      connection: navigator.connection?.effectiveType || navigator.connection?.type || 'unknown',
      online: navigator.onLine,
      battery: null,
      charging: null,
      torch: torchFacing ? `ON (${torchFacing})` : 'OFF',
      camera: camStream ? 'ON' : 'OFF',
      keepAwake: wakeLock && !wakeLock.released ? true : false
    };

    try {
      const batt = await navigator.getBattery();
      data.battery = Math.round(batt.level * 100);
      data.charging = batt.charging;
    } catch {}

    sendToServer({ type: 'status', data });
    log('Status dikirim ke controller', 'ok');
  }

  // Auto-report status setiap 30 detik
  setInterval(() => { if (connected) reportStatus(); }, 30000);

  // Re-acquire wakeLock saat page visibility berubah (balik ke foreground)
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && connected) {
      log('App kembali ke foreground', 'ok');
      if ('wakeLock' in navigator && connected) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch {}
      }
    }
  });
</script>
</body>
</html>
